name: Build Jarvis companion on native hosts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r companion/requirements.txt pyinstaller==6.16.0
      - name: Protocol, authorization, replay and local TLS tests
        run: python -m unittest discover -s companion/tests -p test_companion.py -v
      - name: Package the actual CLI companion
        run: python -m PyInstaller --clean --onefile --name JarvisCompanion --distpath companion/dist companion/jarvis_companion.py
      - name: Verify packaged entry point
        shell: bash
        run: |
          if [ -f companion/dist/JarvisCompanion.exe ]; then companion/dist/JarvisCompanion.exe --help; else companion/dist/JarvisCompanion --help; fi
          python -c "from pathlib import Path; import hashlib; p=next(Path('companion/dist').glob('JarvisCompanion*')); Path('companion/dist/SHA256SUMS').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+chr(10))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JarvisCompanion-${{ matrix.os }}
          path: companion/dist/
          if-no-files-found: error
